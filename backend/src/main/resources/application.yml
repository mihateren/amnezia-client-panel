panel:
  api:
    datasource:
      sqlite:
        type: com.zaxxer.hikari.HikariDataSource
        driver-class-name: org.sqlite.JDBC
        url: ${SQLITE_URL:jdbc:sqlite:panel.db}
        hikari:
          maximum-pool-size: 1
          connection-init-sql: PRAGMA busy_timeout=10000
          connection-timeout: 15000
spring:
  threads:
    virtual:
      enabled: true
  application:
    name: amnezia-control-panel
  liquibase:
    change-log: classpath:/db-migrations/changelog.xml
  main:
    banner-mode: off
  config:
    import: optional:configtree:/run/secrets/
server:
  shutdown: graceful
  max-http-request-header-size: 16KB
  tomcat:
    max-http-form-post-size: 16KB
logging:
  pattern:
    console: '%d{ISO8601} %-5level [%thread] correlation_id=%X{correlation_id} %logger{36} - %msg%n'
  level:
    org.springframework.jdbc: WARN
    org.springframework.web: WARN
    org.springframework.security: WARN
    com.zaxxer.hikari: WARN
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: when-authorized
      roles: ADMIN
      probes:
        enabled: true
  metrics:
    tags:
      application: amnezia-control-panel
monitoring:
  token: ${METRICS_TOKEN:}
app:
  jwt-secret: ${JWT_SECRET}
  encryption-key: ${ENCRYPTION_KEY}
  public-url: ${PUBLIC_URL:https://localhost:8080}
  access-ttl: ${ACCESS_TTL:PT15M}
  refresh-ttl: ${REFRESH_TTL:P30D}
  link-ttl: ${CONFIG_LINK_TTL:PT1H}
  bootstrap-nickname: ${BOOTSTRAP_ADMIN_NICKNAME:}
  bootstrap-password: ${BOOTSTRAP_ADMIN_PASSWORD:}
  ssh:
    host: ${VDS_HOST:localhost}
    port: ${VDS_PORT:22}
    username: ${VDS_USERNAME:root}
    private-key: ${SSH_PRIVATE_KEY:/run/secrets/ssh_key}
    known-hosts: ${SSH_KNOWN_HOSTS:/run/secrets/known_hosts}
    timeout: ${SSH_TIMEOUT:PT20S}
    container: ${AWG_CONTAINER:amnezia-awg}
  vpn:
    interface-name: ${AWG_INTERFACE:awg0}
    config-path: ${AWG_CONFIG_PATH:/opt/amnezia/awg/awg0.conf}
    public-key-path: ${AWG_PUBLIC_KEY_PATH:/opt/amnezia/awg/wireguard_server_public_key.key}
    psk-path: ${AWG_PSK_PATH:/opt/amnezia/awg/wireguard_psk.key}
    subnet: ${VPN_SUBNET:10.8.1.0/24}
    endpoint: ${VPN_ENDPOINT:localhost:51820}
    dns: ${VPN_DNS:1.1.1.1, 1.0.0.1}
    allowed-ips: ${VPN_ALLOWED_IPS:0.0.0.0/0, ::/0}
    client-signature: ${VPN_CLIENT_SIGNATURE:}
    handshake-threshold: ${HANDSHAKE_THRESHOLD:PT3M}
    poll-delay: ${VPN_POLL_DELAY:30000}
